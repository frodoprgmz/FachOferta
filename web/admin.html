<!doctype html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FachOferta — Panel administracyjny</title>
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-title" content="FachOferta" />
  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/admin-config.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-800">
  <main class="mx-auto max-w-6xl p-4 md:p-8">
    <div class="mb-8 flex items-center justify-between">
      <div>
        <p class="text-sm font-semibold text-blue-600">FachOferta</p>
        <h1 class="text-2xl font-bold text-slate-900">Panel administracyjny</h1>
      </div>
      <button id="logout" class="hidden rounded-lg border border-slate-300 bg-white px-4 py-2 text-sm font-semibold">Wyloguj</button>
    </div>

    <section id="login-card" class="mx-auto max-w-md rounded-2xl bg-white p-8 text-center shadow">
      <h2 class="mb-2 text-xl font-bold">Logowanie administratora</h2>
      <p class="mb-6 text-sm text-slate-500">Zaloguj się kontem Google administratora.</p>
      <button id="google-login" class="w-full rounded-xl bg-slate-900 px-4 py-3 font-semibold text-white">Kontynuuj z Google</button>
      <p id="login-error" class="mt-4 hidden text-sm text-red-600"></p>
    </section>

    <section id="admin-card" class="hidden">
      <div class="mb-4 flex flex-wrap items-center justify-between gap-3">
        <p id="signed-in" class="text-sm text-slate-500"></p>
        <button id="refresh" class="rounded-lg bg-blue-600 px-4 py-2 text-sm font-semibold text-white">Odśwież</button>
      </div>
      <div id="panel-error" class="mb-4 hidden rounded-lg border border-red-200 bg-red-50 p-3 text-sm text-red-700"></div>
      <div class="overflow-x-auto rounded-2xl bg-white shadow">
        <table class="w-full text-left text-sm">
          <thead class="bg-slate-900 text-white">
            <tr>
              <th class="p-3">Użytkownik</th>
              <th class="p-3">Status</th>
              <th class="p-3">Wygasa</th>
              <th class="p-3">Akcja</th>
            </tr>
          </thead>
          <tbody id="users"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    const ADMIN_EMAIL = 'protivwebdev@gmail.com';
    const config = window.FACHOFERTA_SUPABASE || {};
    const supabaseClient = supabase.createClient(config.url || '', config.anonKey || '');
    const loginCard = document.getElementById('login-card');
    const adminCard = document.getElementById('admin-card');
    const users = document.getElementById('users');
    const panelError = document.getElementById('panel-error');

    function showError(target, message) {
      target.textContent = message;
      target.classList.remove('hidden');
    }

    function clearError(target) {
      target.textContent = '';
      target.classList.add('hidden');
    }

    async function signIn() {
      clearError(document.getElementById('login-error'));
      const { error } = await supabaseClient.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: `${window.location.origin}/admin.html` },
      });
      if (error) showError(document.getElementById('login-error'), error.message);
    }

    async function loadUsers() {
      clearError(panelError);
      users.innerHTML = '<tr><td colspan="4" class="p-6 text-center text-slate-500">Ładowanie...</td></tr>';
      const { data, error } = await supabaseClient.rpc('admin_list_profiles');
      if (error) {
        showError(panelError, error.message);
        users.innerHTML = '';
        return;
      }

      users.innerHTML = (data || []).map((profile) => {
        const expires = profile.subscription_expires_at
          ? new Date(profile.subscription_expires_at).toISOString().slice(0, 10)
          : '';
        return `
          <tr class="border-b border-slate-100">
            <td class="p-3"><div class="font-semibold">${profile.email || profile.id}</div><div class="text-xs text-slate-500">${profile.company_name || 'Brak nazwy firmy'}</div></td>
            <td class="p-3"><select data-status="${profile.id}" class="rounded border border-slate-300 p-2">
              ${['trial', 'active', 'expired'].map((status) => `<option value="${status}" ${status === profile.subscription_status ? 'selected' : ''}>${status}</option>`).join('')}
            </select></td>
            <td class="p-3"><input data-expires="${profile.id}" type="date" value="${expires}" class="rounded border border-slate-300 p-2" /></td>
            <td class="p-3"><button data-save="${profile.id}" class="rounded bg-emerald-600 px-3 py-2 font-semibold text-white">Zapisz</button></td>
          </tr>`;
      }).join('') || '<tr><td colspan="4" class="p-6 text-center text-slate-500">Brak profili.</td></tr>';

      document.querySelectorAll('[data-save]').forEach((button) => {
        button.addEventListener('click', () => updateSubscription(button.dataset.save));
      });
    }

    async function updateSubscription(userId) {
      clearError(panelError);
      const status = document.querySelector(`[data-status="${userId}"]`).value;
      const expires = document.querySelector(`[data-expires="${userId}"]`).value || null;
      const { error } = await supabaseClient.rpc('admin_update_subscription', {
        target_user_id: userId,
        new_status: status,
        new_expires_at: expires,
      });
      if (error) {
        showError(panelError, error.message);
        return;
      }
      await loadUsers();
    }

    async function initialise() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) return;
      if ((session.user.email || '').toLowerCase() !== ADMIN_EMAIL) {
        showError(document.getElementById('login-error'), 'To konto nie ma uprawnień administratora.');
        await supabaseClient.auth.signOut();
        return;
      }
      loginCard.classList.add('hidden');
      adminCard.classList.remove('hidden');
      document.getElementById('logout').classList.remove('hidden');
      document.getElementById('signed-in').textContent = `Zalogowano jako ${session.user.email}`;
      await loadUsers();
    }

    document.getElementById('google-login').addEventListener('click', signIn);
    document.getElementById('refresh').addEventListener('click', loadUsers);
    document.getElementById('logout').addEventListener('click', async () => {
      await supabaseClient.auth.signOut();
      window.location.reload();
    });
    initialise();
  </script>
</body>
</html>
